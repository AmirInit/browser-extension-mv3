name: Community patched extension

on:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:
    inputs:
      force_build:
        description: Build a new prerelease even when source and patches are unchanged
        type: boolean
        default: false

permissions: {}
concurrency:
  group: windscribe-community-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  detect:
    name: Inspect official source and existing releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      upstream_sha: ${{ steps.detect.outputs.upstream_sha }}
      version: ${{ steps.detect.outputs.version }}
      source_fingerprint: ${{ steps.detect.outputs.source_fingerprint }}
      patch_digest: ${{ steps.detect.outputs.patch_digest }}
      tag: ${{ steps.detect.outputs.tag }}
      previous_sha: ${{ steps.detect.outputs.previous_sha }}
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test release safety controls
        run: python3 -m unittest discover -s automation/tests -v
      - id: detect
        name: Detect current source and prior completed releases
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build && 'true' || 'false' }}
        run: python3 automation/detect.py

  build:
    name: Build and validate without release credentials
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
      VERSION: ${{ needs.detect.outputs.version }}
      SOURCE_FINGERPRINT: ${{ needs.detect.outputs.source_fingerprint }}
      PATCH_DIGEST: ${{ needs.detect.outputs.patch_digest }}
      PREVIOUS_SHA: ${{ needs.detect.outputs.previous_sha }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      PIPELINE_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      IMAGE: node@sha256:3266bc9e8bee1acc8a77386eefaf574987d2729b8c5ec35b0dbd6ddbc40b0ce2 # node 22.18.0 bookworm
    steps:
      - name: Check out trusted release controls
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: control
          persist-credentials: false
      - name: Check out exact public upstream revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Windscribe/browser-extension-mv3
          ref: ${{ needs.detect.outputs.upstream_sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          submodules: false
      - name: Integrate reviewed patches and pinned uBO source
        run: python3 control/automation/prepare.py prepare "$GITHUB_WORKSPACE/candidate" "$UPSTREAM_SHA"
      - name: Fetch and preserve fresh public location metadata
        run: |
          python3 control/automation/locations.py "$GITHUB_WORKSPACE/candidate/.community-ci/locations.json"
          cp "$GITHUB_WORKSPACE/candidate/.community-ci/locations.json" "$RUNNER_TEMP/community-locations.json"
          sha256sum "$GITHUB_WORKSPACE/candidate/.community-ci/locations.json" > "$RUNNER_TEMP/community-locations.sha256"
      - name: Install without lifecycle scripts and audit inside isolated container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 1024 --memory 6g --cpus 2 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/candidate,dst=/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control/automation,dst=/pipeline,readonly" \
            --workdir /work "$IMAGE" bash /pipeline/install-in-sandbox.sh
          python3 control/automation/audit.py "$GITHUB_WORKSPACE/candidate/.community-ci/audit.jsonl" "$RUNNER_TEMP/community-audit.json"
          if [[ $(cat "$GITHUB_WORKSPACE/candidate/.community-ci/mode") == equivalent-probe ]]; then
            docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 1024 --memory 6g --cpus 2 \
              --env NODE_PATH=/work/node_modules \
              --mount "type=bind,src=$GITHUB_WORKSPACE/candidate,dst=/work" \
              --mount "type=bind,src=$GITHUB_WORKSPACE/control/automation,dst=/pipeline,readonly" \
              --workdir /work "$IMAGE" node --test /pipeline/fixtures/tests/unit/reduxBroadcast.test.cjs
            python3 control/automation/prepare.py finish-equivalent "$GITHUB_WORKSPACE/candidate"
          fi
      - name: Test and build with network access disabled
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 1024 --memory 6g --cpus 2 \
            --mount "type=bind,src=$GITHUB_WORKSPACE/candidate,dst=/work" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control/automation,dst=/pipeline,readonly" \
            --workdir /work "$IMAGE" bash /pipeline/test-build-in-sandbox.sh
          sha256sum --check "$RUNNER_TEMP/community-locations.sha256"
      - name: Smoke-test built MV3 extension and actual worker restart offline
        run: |
          docker run --rm --init --network none --user "$(id -u):$(id -g)" --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 1024 --memory 4g --cpus 2 --shm-size 512m \
            --env HOME=/tmp --env XDG_CONFIG_HOME=/tmp/config --env XDG_CACHE_HOME=/tmp/cache \
            --env NODE_PATH=/work/node_modules \
            --env CHROME_BINARY=/home/pptruser/.cache/puppeteer/chrome/linux-131.0.6778.85/chrome-linux64/chrome \
            --env "WS_EXPECTED_VERSION=$VERSION" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/candidate,dst=/work,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/control/automation,dst=/pipeline,readonly" \
            --workdir /work --entrypoint node \
            ghcr.io/puppeteer/puppeteer@sha256:c948d9c0590714298c5318209d804fba7925e3e77e57024263443aa62ed99847 \
            /pipeline/browser-smoke.cjs
      - name: Validate manifest, privacy scripts, rulesets, archive, and provenance
        run: |
          python3 control/automation/artifacts.py package "$GITHUB_WORKSPACE/candidate" \
            "$RUNNER_TEMP/community-release" "$RUNNER_TEMP/community-locations.json" "$RUNNER_TEMP/community-audit.json"
      - id: upload
        name: Upload validated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: community-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify provenance and publish prerelease
    needs: [detect, build]
    if: >-
      needs.build.result == 'success' && github.ref == 'refs/heads/public' &&
      github.repository == 'AmirInit/browser-extension-mv3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      UPSTREAM_SHA: ${{ needs.detect.outputs.upstream_sha }}
      VERSION: ${{ needs.detect.outputs.version }}
      SOURCE_FINGERPRINT: ${{ needs.detect.outputs.source_fingerprint }}
      PATCH_DIGEST: ${{ needs.detect.outputs.patch_digest }}
      PREVIOUS_SHA: ${{ needs.detect.outputs.previous_sha }}
      RELEASE_TAG: ${{ needs.detect.outputs.tag }}
      PIPELINE_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
      ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
    steps:
      - name: Check out trusted release controls only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download artifact and verify run-bound digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact-info.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact-envelope.zip"
          python3 automation/verify-github-artifact.py "$RUNNER_TEMP/artifact-info.json" "$RUNNER_TEMP/artifact-envelope.zip"
          python3 automation/artifacts.py validate-envelope "$RUNNER_TEMP/artifact-envelope.zip" "$RUNNER_TEMP/verified-release"
      - name: Create immutable tag and draft prerelease, then verify every uploaded asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}-wsfix\.[1-9][0-9]*$ ]]
          [[ "$PIPELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$PIPELINE_SHA" > /dev/null
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Windscribe $VERSION — Community Patched" \
            --notes-file "$RUNNER_TEMP/verified-release/release-notes.md" \
            "$RUNNER_TEMP/verified-release/windscribe-community.zip" \
            "$RUNNER_TEMP/verified-release/SHA256SUMS" \
            "$RUNNER_TEMP/verified-release/CHANGELOG.md" \
            "$RUNNER_TEMP/verified-release/BUILD-INFO.json"
          # GitHub's by-tag endpoint only returns published releases. List
          # releases using the write token to locate and verify this draft.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/draft-releases.json"
          python3 automation/verify-release.py "$RUNNER_TEMP/draft-releases.json" "$RUNNER_TEMP/verified-release" draft
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-published.json"
          python3 automation/verify-release.py "$RUNNER_TEMP/release-published.json" "$RUNNER_TEMP/verified-release" published
